[build]
# Default target for the kernel — bare metal x86_64
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
runner = "tools/run-qemu.sh"
rustflags = ["-C", "link-arg=-Tkernel/linker.ld", "-C", "relocation-model=static"]
