[workspace]
resolver = "2"
members = [
    "kernel",
    "driver-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KontsnorOS Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/kontsnor/KontsnorOS"
description = "Highly experimental Unix-compatible Rust kernel built while testing Antigravity IDE with Gemini 3.5 & 3.6 (no warranty)"

[workspace.dependencies]
# Shared dependency versions across workspace
spin = "0.9"
bitflags = "2.9"
log = "0.4"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
debug = true

[profile.fast-build]
inherits = "release"
panic = "abort"
lto = false
codegen-units = 1
opt-level = 0
debug = false

